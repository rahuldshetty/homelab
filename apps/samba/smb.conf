# Samba config for the qBittorrent downloads directory: anonymous, read-only,
# and every file access forced to the `nobody` user. Installed by setup.sh at
# /etc/samba/smb.conf (replacing Fedora's default printer/home shares).
#
# `force user = nobody` only works because smbd runs as root (system unit).
# `nobody` therefore needs read+traverse on the path; setup.sh grants that with
# ACLs. Anonymous clients are mapped to the guest account (`map to guest`).

[global]
	workgroup = WORKGROUP
	server string = %h
	server role = standalone server
	# Guest/anonymous: unknown users are mapped onto the guest account.
	security = user
	map to guest = Bad User
	guest account = nobody
	# No printers on this host.
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	# SMB1 is disabled universally; keep SMB2+ only.
	server min protocol = SMB2
	logging = file
	log file = /var/log/samba/log.%m
	max log size = 1000

[downloads]
	comment = qBittorrent downloads (read-only)
	path = /home/rahul/media/downloads
	browseable = yes
	read only = yes
	guest ok = yes
	# All access runs as `nobody`, regardless of the client identity.
	force user = nobody
	force group = nobody
	# Nothing in this share is writable, but keep masks tight anyway.
	create mask = 0444
	directory mask = 0555
