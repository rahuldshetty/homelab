# Read-only shares of the downloads and Steam library dirs, authenticated as the
# local user. SELinux uses the stock `samba_export_all_ro` boolean (see README).
[global]
	workgroup = WORKGROUP
	server string = %h
	server role = standalone server
	security = user
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	server min protocol = SMB2
	logging = file
	log file = /var/log/samba/log.%m
	max log size = 1000
	# No [homes]: this file replaces the packaged default, so user homes are
	# not shared implicitly.

[downloads]
	comment = qBittorrent downloads (read-only)
	path = /home/rahul/media/downloads
	browseable = yes
	read only = yes
	valid users = rahul

[steamapps]
	comment = Steam library (read-only)
	path = /home/rahul/.local/share/Steam/steamapps
	browseable = yes
	read only = yes
	valid users = rahul
