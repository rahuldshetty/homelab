# Seed for the container's /config/qBittorrent/qBittorrent.conf; setup.sh strips
# these comments when copying, because qBittorrent's parser turns any comment
# line containing "=" into a bogus key. The client rewrites this file flat as
# soon as it saves a setting, so this is a seed and not a live copy.

[LegalNotice]
Accepted=true

[BitTorrent]
Session\DefaultSavePath=/downloads/

[Network]
PortForwardingEnabled=false

[Preferences]
# The s6 readiness probe in the image greps this key; empty means localhost.
WebUI\Address=*
WebUI\Port=8080

# No authentication: the whitelist spans every address, so isAuthNeeded() is
# false for all clients. LocalHostAuth=false covers in-namespace callers too.
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=0.0.0.0/0, ::/0

# CSRF rejects an Origin that disagrees with the forwarded Host -- exactly what
# a TLS-terminating proxy looks like -- and with no credentials defends nothing.
WebUI\CSRFProtection=false

# Behind Traefik: honour X-Forwarded-For/Proto. The list trusts every address
# because this host is reachable only over the tailnet and the WebUI is never
# published, so no untrusted peer can spoof the header. setup.sh writes
# .env QBITTORRENT_TRUSTED_PROXIES in place of this line when set. The Host
# check stays on; it only rejects a Host carrying a port other than the
# WebUI's.
WebUI\ReverseProxySupportEnabled=true
WebUI\TrustedReverseProxiesList="0.0.0.0/0; ::/0"
WebUI\ServerDomains=*
WebUI\HostHeaderValidation=true
