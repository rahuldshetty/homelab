# Seed for /config/qBittorrent/qBittorrent.conf. setup.sh strips these comments
# when copying: qBittorrent's parser turns any "#" line containing "=" into a
# bogus key. The client rewrites the file flat on every settings change.

[LegalNotice]
Accepted=true

[BitTorrent]
Session\DefaultSavePath=/downloads/

[Network]
PortForwardingEnabled=false

[Preferences]
# The image's s6 readiness probe greps this key; empty means localhost.
WebUI\Address=*
WebUI\Port=8080

# No authentication: the whitelist spans every address, so isAuthNeeded() is
# false for all clients. LocalHostAuth=false covers in-namespace callers too.
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=0.0.0.0/0, ::/0

# CSRF rejects an Origin that disagrees with the forwarded Host -- normal
# behind a TLS-terminating proxy -- and with no credentials defends nothing.
WebUI\CSRFProtection=false

# Honour X-Forwarded-For/Proto from any peer: the WebUI is never published and
# this host is tailnet-only, so nothing untrusted can spoof the header.
# setup.sh substitutes .env QBITTORRENT_TRUSTED_PROXIES when set.
WebUI\ReverseProxySupportEnabled=true
WebUI\TrustedReverseProxiesList="0.0.0.0/0; ::/0"
WebUI\ServerDomains=*
WebUI\HostHeaderValidation=true
