theme:
  background-color: 240 24 11
  contrast-multiplier: 1.4
  primary-color: 189 100 58
  positive-color: 152 90 55
  negative-color: 348 100 68
  text-saturation-multiplier: 0.9

server:
  # Behind Traefik: read X-Forwarded-* for the real client address.
  proxied: true

pages:
  - name: Home
    head-widgets:
      - type: markets
        hide-header: true
        markets:
          - symbol: IBM
            name: IBM
          - symbol: NVDA
            name: NVIDIA
          - symbol: MSFT
            name: Microsoft
          - symbol: GOOG
            name: Google

    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: weather
            location: Karkala, Karnataka, India
            units: metric
            hour-format: 24h

      - size: full
        widgets:
          - type: hacker-news
            limit: 10
            collapse-after: 5

      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

  - name: Services
    columns:
      - size: small
        widgets:
          - $include: widgets/containers.yml

          - type: bookmarks
            groups:
              - title: Services
                links:
                  - title: qBittorrent
                    url: /qbit/
                  - title: Calibre-Web
                    url: /ebooks/
                  - title: Traefik
                    url: /traefik/

      - size: full
        widgets:
          - $include: widgets/qbittorrent.yml

          - $include: widgets/qbittorrent-counts.yml

      - size: small
        widgets:
          - $include: widgets/traefik.yml
