# Traefik's own UI and API under api.basePath (/traefik), loopback only: the
# tailnet-facing routers live in the generated tailnet.yml. `/` is deliberately
# unrouted (`api.insecure`'s 301 to the dashboard is not wanted).
http:
  routers:
    # Longer rule wins, so /traefik/api/* bypasses the UI rewrite below.
    traefik-api:
      entryPoints: [dashboard]
      rule: "PathPrefix(`/traefik/api`)"
      service: api@internal

    traefik-ui:
      entryPoints: [dashboard]
      rule: "PathPrefix(`/traefik`)"
      service: api@internal
      middlewares: [traefik-slash, traefik-ui-rewrite]

  middlewares:
    # Nothing redirects /traefik to /traefik/; the query group preserves
    # e.g. /traefik?tab=x across the 301.
    traefik-slash:
      redirectRegex:
        regex: '^(.*)/traefik(\?.*)?$'
        replacement: "${1}/traefik/${2}"
        permanent: true

    # The handler serves /traefik/dashboard/...; the UI's relative asset paths
    # need /traefik/assets/... to reach it.
    traefik-ui-rewrite:
      replacePathRegex:
        regex: "^/traefik(/.*)?$"
        replacement: "/traefik/dashboard${1}"
