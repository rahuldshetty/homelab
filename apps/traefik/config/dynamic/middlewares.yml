# Hot-reloaded. Reference these from labels/routers as name@file.
http:
  middlewares:
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true # breaks apps that iframe themselves
        referrerPolicy: strict-origin-when-cross-origin

    # Optional per-user gate; seed the file with:
    #   htpasswd -nB admin > apps/traefik/config/dynamic/users.htpasswd
    # admin-auth:
    #   basicAuth:
    #     usersFile: /etc/traefik/dynamic/users.htpasswd
