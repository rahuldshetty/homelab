# Static config: changes need `scripts/stack.sh restart traefik.service`.
# Routing and middlewares live in ./dynamic/ and hot-reload.

log:
  level: INFO

accessLog: {}

api:
  dashboard: true
  # Shared ts.net host -- Homarr owns /api/* -- so the dashboard lives under
  # /traefik. `insecure: true` is gone: it injected a `/` -> dashboard 301.
  basePath: /traefik

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  # Dashboard/API, published to 127.0.0.1 only by ../traefik.container.
  dashboard:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///run/podman/podman.sock"
    exposedByDefault: false
    network: media
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  # Certs come from the local tailscaled (socket mounted in ../traefik.container);
  # needs HTTPS enabled for the tailnet and `tailscale set --operator=<user>`.
  tailscale:
    tailscale: {}

# The resolver fetches a cert for a router that references it and states a
# domain (Host() or tls.domains[].main) -- see the generated dynamic/tailnet.yml.
# Other routers serve that cert from the default TLS store.
